# Minimal observation-only configuration. See incidents.example.yaml for reporting.
server:
  id: example-host

docker:
  # Docker Engine 25+ / API 1.44+ required. No TCP sockets accepted.
  socket: unix:///var/run/docker.sock
  timeout: 3s

# Delay after each completed scan; scans never overlap.
interval: 30s

targets:
  - name: example-api
    selector:
      # Exact standalone container name, not an ID prefix or wildcard.
      container_name: example-api
    monitoring:
      enabled: true
      docker_health:
        # Metadata only; review the probe implementation before changing this.
        meaning: unknown
    recovery:
      # See recovery.example.yaml; keep disabled for observation-only use.
      enabled: false
